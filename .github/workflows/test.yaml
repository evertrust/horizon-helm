name: Test

on:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    test:
        runs-on:
          - runs-on=${{ github.run_id }}
          - runner=2cpu-linux-x64
        steps:
          - name: Checkout
            uses: actions/checkout@v3

          - name: Setup mise
            uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
            with:
              version: 2026.6.14

          - name: Verify image tag
            run: mise run check-image-tag

          - name: Install Helm
            uses: azure/setup-helm@v3
            with:
              version: v3.19.3

          - name: Test chart
            run: make test
